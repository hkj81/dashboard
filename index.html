<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>태전그룹 · 도매 시스템</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f172a;
    color:#f1f5f9;
    font-family:'Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header {
    padding:28px 24px 16px;
    border-bottom:1px solid #1e293b;
  }
  .header-sub { font-size:12px; color:#64748b; letter-spacing:1px; margin-bottom:4px; }
  .header-title { font-size:22px; font-weight:800; color:#f1f5f9; }

  .hero {
    padding:24px 24px 8px;
    text-align:center;
  }
  .hero-text { font-size:14px; color:#64748b; line-height:1.6; }

  .grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    padding:16px 20px;
    flex:1;
  }
  .card {
    background:#1e293b;
    border-radius:20px;
    padding:24px 16px;
    text-align:center;
    cursor:pointer;
    text-decoration:none;
    color:#f1f5f9;
    transition:transform .15s, background .15s;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    border:2px solid transparent;
  }
  .card:hover, .card:active {
    transform:scale(1.03);
    border-color:#334155;
  }
  .card-icon { font-size:38px; }
  .card-title { font-size:15px; font-weight:700; }
  .card-desc { font-size:12px; color:#64748b; line-height:1.5; }
  .card-badge {
    font-size:11px;
    padding:3px 10px;
    border-radius:20px;
    font-weight:600;
    margin-top:4px;
  }

  .card-expiry { border-top:3px solid #f59e0b; }
  .card-expiry .card-badge { background:#f59e0b22; color:#f59e0b; }

  .card-strengths { border-top:3px solid #8b5cf6; }
  .card-strengths .card-badge { background:#8b5cf622; color:#8b5cf6; }

  .card-pill { border-top:3px solid #22c55e; }
  .card-pill .card-badge { background:#22c55e22; color:#22c55e; }

  .card-full {
    grid-column: span 2;
  }

  footer {
    text-align:center;
    padding:20px;
    font-size:12px;
    color:#334155;
  }
</style>
</head>
<body>

<header>
  <div class="header-sub">태전그룹 · 도매 시스템</div>
  <div class="header-title">📋 메인 메뉴</div>
</header>

<div class="hero">
  <div class="hero-text">원하는 기능을 선택하세요</div>
</div>

<div class="grid">

  <a class="card card-expiry" href="expiry.html">
    <div class="card-icon">⏰</div>
    <div class="card-title">유통기한 임박</div>
    <div class="card-desc">제품 유통기한<br>조회 및 관리</div>
    <div class="card-badge">재고 관리</div>
  </a>

  <a class="card card-strengths" href="strengths.html">
    <div class="card-icon">💪</div>
    <div class="card-title">갤럽 강점 분석</div>
    <div class="card-desc">CliftonStrengths<br>팀 강점 시각화</div>
    <div class="card-badge">팀 분석</div>
  </a>

  <a class="card card-pill card-full" href="pill-counter.html">
    <div class="card-icon">💊</div>
    <div class="card-title">알약 카운터</div>
    <div class="card-desc">AI 카메라로 알약 개수 자동 측정 · 누적 합산</div>
    <div class="card-badge">AI 도구</div>
  </a>

</div>

<footer>태전그룹 도매 시스템 · 희망-실천 4기 2팀</footer>

</body>
</html>
