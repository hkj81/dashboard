<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>갤럽 강점 분석</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f172a;--surface:#1e293b;--surface2:#334155;--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--ex:#f59e0b;--in:#ef4444;--re:#3b82f6;--st:#8b5cf6;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',-apple-system,sans-serif;min-height:100vh;max-width:640px;margin:0 auto;}
.screen{display:none;min-height:100vh;flex-direction:column;}
.screen.active{display:flex;}
header{padding:14px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--surface);position:sticky;top:0;background:var(--bg);z-index:40;}
.btn-back{background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;padding:4px 8px 4px 0;}
.hd-title{font-size:17px;font-weight:800;flex:1;}
.hd-sub{font-size:11px;color:var(--text3);}
.scroll{flex:1;overflow-y:auto;padding:14px 18px 100px;}
.tab-row{display:flex;gap:8px;padding:10px 18px;overflow-x:auto;border-bottom:1px solid var(--surface);scrollbar-width:none;}
.tab-row::-webkit-scrollbar{display:none;}
.tab{background:var(--surface);border:none;border-radius:20px;color:var(--text2);padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;}
.tab.on{background:var(--text);color:var(--bg);}
/* Person card */
.p-card{background:var(--surface);border-radius:14px;padding:13px 15px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s;border:1.5px solid transparent;}
.p-card:hover{background:var(--surface2);}
.p-card.done{border-color:var(--surface2);}
.p-avatar{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;}
.p-info{flex:1;}
.p-name{font-size:15px;font-weight:700;}
.p-role{font-size:11px;color:var(--text3);margin-top:2px;}
.mini-tags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;}
.mini-tag{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600;}
.p-badge{font-size:11px;padding:3px 8px;border-radius:10px;flex-shrink:0;}
.badge-done{background:#22c55e22;color:#22c55e;}
.badge-empty{background:var(--surface2);color:var(--text3);}
/* Chip grid */
.domain-block{margin-bottom:16px;}
.domain-hd{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;margin-bottom:10px;}
.d-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.d-name{font-size:13px;font-weight:700;}
.d-cnt{font-size:12px;color:var(--text3);margin-left:auto;}
.chip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.chip{background:var(--surface);border:1.5px solid var(--surface2);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;transition:all .15s;position:relative;user-select:none;}
.chip:hover{border-color:var(--text3);}
.chip.sel{color:#fff;}
.chip-rank{position:absolute;top:5px;right:5px;font-size:10px;font-weight:800;width:17px;height:17px;border-radius:50%;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;}
.chip-ko{font-size:13px;font-weight:600;display:block;}
.chip-en{font-size:9px;color:var(--text3);display:block;margin-top:2px;}
.chip.sel .chip-en{color:rgba(255,255,255,0.55);}
/* Top5 bar */
.top5-bar{background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:14px;}
.top5-lbl{font-size:11px;color:var(--text3);margin-bottom:8px;}
.top5-tags{display:flex;gap:6px;flex-wrap:wrap;}
.ttag{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600;}
/* Submit */
.sub-btn{width:100%;padding:15px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;transition:all .2s;}
.sub-btn:disabled{opacity:.4;cursor:not-allowed;background:var(--surface2);color:var(--text3);}
.sub-btn.ready{background:#22c55e;color:#000;}
/* Profile */
.prof-hero{background:var(--surface);border-radius:16px;padding:20px;text-align:center;margin-bottom:14px;}
.prof-name{font-size:24px;font-weight:800;}
.prof-team{font-size:13px;color:var(--text3);margin-top:4px;}
.prof-updated{font-size:11px;color:var(--text3);margin-top:4px;}
.edit-btn{margin-top:12px;background:var(--surface2);border:none;border-radius:10px;color:var(--text2);padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer;}
/* Strength card */
.str-card{border-radius:12px;padding:0;margin-bottom:8px;overflow:hidden;}
.str-card-top{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;}
.rank-circle{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0;}
.sc-info{flex:1;}
.sc-ko{font-size:16px;font-weight:700;}
.sc-en{font-size:11px;opacity:.65;margin-top:1px;}
.sc-domain{font-size:10px;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,0.25);margin-top:4px;display:inline-block;}
.str-expand{display:none;padding:0 16px 14px 16px;border-top:1px solid rgba(255,255,255,0.08);}
.str-expand.open{display:block;}
.str-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:10px;margin-top:10px;}
.str-pros-cons{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pros-box,.cons-box{border-radius:10px;padding:10px 12px;}
.pros-box{background:rgba(34,197,94,0.1);}
.cons-box{background:rgba(239,68,68,0.1);}
.box-label{font-size:11px;font-weight:700;margin-bottom:6px;}
.pros-box .box-label{color:#22c55e;}
.cons-box .box-label{color:#ef4444;}
.box-content{font-size:12px;color:var(--text2);line-height:1.5;}
/* Chart */
.chart-box{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:14px;}
.chart-title{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:12px;}
.chart-wrap{position:relative;height:200px;}
/* AI 분석 */
.ai-section{background:linear-gradient(135deg,#1e1b4b,#1e293b);border-radius:16px;padding:16px;margin-bottom:14px;border:1px solid #4c1d95;}
.ai-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.ai-title{font-size:14px;font-weight:700;color:#a78bfa;}
.ai-run-btn{margin-left:auto;background:#7c3aed;border:none;border-radius:10px;color:#fff;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;}
.ai-result{font-size:13px;color:var(--text2);line-height:1.7;white-space:pre-wrap;}
.ai-result h3{color:#a78bfa;font-size:13px;margin:12px 0 4px;}
.ai-placeholder{font-size:13px;color:var(--text3);text-align:center;padding:20px 0;}
/* Team compare */
.team-compare-box{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:14px;}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;z-index:200;}
.modal.open{display:flex;}
.modal-box{background:var(--surface);border-radius:20px 20px 0 0;padding:24px 20px;width:100%;}
.modal-title{font-size:17px;font-weight:700;margin-bottom:8px;}
.modal-desc{font-size:13px;color:var(--text3);line-height:1.6;margin-bottom:14px;}
.modal-input{width:100%;background:var(--bg);border:1px solid var(--surface2);border-radius:10px;padding:12px;color:var(--text);font-size:13px;margin-bottom:12px;}
.modal-btn{width:100%;padding:14px;border:none;border-radius:12px;background:#22c55e;color:#000;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px;}
.modal-cancel{width:100%;padding:10px;border:none;background:transparent;color:var(--text3);font-size:14px;cursor:pointer;}
/* Spinner */
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
/* Section label */
.sec-label{font-size:12px;font-weight:700;color:var(--text3);margin-bottom:8px;letter-spacing:.5px;}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="s-home">
  <header>
    <a href="index.html" class="btn-back">←</a>
    <div><div class="hd-title">💪 갤럽 강점 분석</div><div class="hd-sub">CliftonStrengths · 희망-실천 4기</div></div>
  </header>
  <div class="tab-row" id="team-tabs"></div>
  <div class="scroll" id="member-list"></div>
</div>

<!-- INPUT -->
<div class="screen" id="s-input">
  <header>
    <button class="btn-back" onclick="goHome()">←</button>
    <div><div class="hd-title" id="input-hd">강점 입력</div><div class="hd-sub">상위 5개를 순서대로 선택하세요</div></div>
  </header>
  <div class="scroll" id="input-area"></div>
</div>

<!-- PROFILE -->
<div class="screen" id="s-profile">
  <header>
    <button class="btn-back" onclick="goHome()">←</button>
    <div class="hd-title" id="prof-hd">프로필</div>
  </header>
  <div class="scroll" id="prof-area"></div>
</div>

<!-- TOKEN MODAL -->
<div class="modal" id="tok-modal">
  <div class="modal-box">
    <div class="modal-title">🔑 GitHub 토큰 설정</div>
    <div class="modal-desc">팀원들과 데이터를 공유하려면 GitHub Personal Access Token이 필요합니다. <strong style="color:#f1f5f9">한 번만</strong> 입력하면 됩니다.<br><br>
    <a href="https://github.com/settings/tokens/new?scopes=repo&description=strengths" target="_blank" style="color:#3b82f6">→ 토큰 발급 바로가기</a> (repo 권한 체크)</div>
    <input class="modal-input" id="tok-input" type="password" placeholder="ghp_xxxxxxxxxxxx">
    <button class="modal-btn" onclick="saveToken()">저장하고 계속</button>
    <button class="modal-cancel" onclick="closeToken()">취소</button>
  </div>
</div>

<!-- GEMINI KEY MODAL -->
<div class="modal" id="ai-modal">
  <div class="modal-box">
    <div class="modal-title">🤖 Google AI API 키</div>
    <div class="modal-desc">AI 분석을 사용하려면 Gemini API 키가 필요합니다. <strong style="color:#22c55e">하루 1,500번 무료</strong><br>
    <a href="https://aistudio.google.com/apikey" target="_blank" style="color:#3b82f6">→ 키 발급 바로가기</a></div>
    <input class="modal-input" id="ai-key-input" type="text" placeholder="API 키 붙여넣기">
    <button class="modal-btn" onclick="saveAiKey()">저장하고 분석 시작</button>
    <button class="modal-cancel" onclick="document.getElementById('ai-modal').classList.remove('open')">취소</button>
  </div>
</div>

// ══════════════ GITHUB ══════════════
const REPO='hkj81/dashboard', DFILE='strengths_data.json';
let ghToken=localStorage.getItem('ghStrToken')||'';
let allData={}, fileSha='';
let pendingSave=null;

async function loadData(){
  try{
    const h={'Accept':'application/vnd.github.v3+json'};
    if(ghToken) h['Authorization']='token '+ghToken;
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${DFILE}`,{headers:h});
    if(r.ok){const j=await r.json();fileSha=j.sha;allData=JSON.parse(atob(j.content.replace(/\n/g,'')));}
    else{allData={};fileSha='';}
  }catch{allData={};}
  renderHome();
}

async function saveData(name,top5){
  if(!ghToken){pendingSave=()=>saveData(name,top5);document.getElementById('tok-modal').classList.add('open');return false;}
  const team=TEAMS.find(t=>t.leader===name||t.members.includes(name))?.id||'';
  allData[name]={team,top5,updatedAt:new Date().toISOString().slice(0,10)};
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(allData,null,2))));
  const body={message:`강점 업데이트: ${name}`,content};
  if(fileSha) body.sha=fileSha;
  const h={'Authorization':'token '+ghToken,'Content-Type':'application/json'};
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${DFILE}`,{method:'PUT',headers:h,body:JSON.stringify(body)});
    if(r.ok){const j=await r.json();fileSha=j.content.sha;return true;}
    if(r.status===409){await loadData();return await saveData(name,top5);}
    alert('저장 실패. 토큰을 확인해주세요.');return false;
  }catch{alert('네트워크 오류');return false;}
}

function saveToken(){
  const t=document.getElementById('tok-input').value.trim();
  if(t.length<10){alert('토큰이 너무 짧습니다');return;}
  ghToken=t;localStorage.setItem('ghStrToken',t);
  document.getElementById('tok-modal').classList.remove('open');
  if(pendingSave){pendingSave();pendingSave=null;}
}
function closeToken(){document.getElementById('tok-modal').classList.remove('open');}

// ══════════════ NAV ══════════════
let curTeam='1팀', curPerson='', selTop5=[];
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
function goHome(){showScreen('s-home');renderHome();}

// ══════════════ HOME ══════════════
function initTabs(){
  const row=document.getElementById('team-tabs');row.innerHTML='';
  TEAMS.forEach(t=>{
    const b=document.createElement('button');b.className='tab'+(t.id===curTeam?' on':'');b.textContent=t.id;
    b.onclick=()=>{curTeam=t.id;initTabs();renderMemberList();};row.appendChild(b);
  });
}
function renderHome(){initTabs();renderMemberList();}
function renderMemberList(){
  const team=TEAMS.find(t=>t.id===curTeam);
  const el=document.getElementById('member-list');el.innerHTML='';
  const all=[{name:team.leader,role:'팀장'},...team.members.map(m=>({name:m,role:'팀원'}))];
  all.forEach(({name,role})=>{
    const d=allData[name];
    const card=document.createElement('div');card.className='p-card'+(d?' done':'');
    card.innerHTML=`
      <div class="p-avatar">${name[0]}</div>
      <div class="p-info">
        <div class="p-name">${name}</div>
        <div class="p-role">${curTeam} · ${role}</div>
        ${d?`<div class="mini-tags">${d.top5.slice(0,3).map(ko=>{const s=S.find(x=>x.ko===ko);return`<span class="mini-tag" style="background:${DOM[s?.d||'ex'].bg};color:${DOM[s?.d||'ex'].color}">${ko}</span>`;}).join('')}${d.top5.length>3?`<span style="font-size:10px;color:var(--text3)">+${d.top5.length-3}</span>`:''}</div>`:''}
      </div>
      <span class="p-badge ${d?'badge-done':'badge-empty'}">${d?'완료':'미입력'}</span>`;
    card.onclick=()=>d?openProfile(name):openInput(name);
    el.appendChild(card);
  });
}

// ══════════════ INPUT ══════════════
function openInput(name){
  curPerson=name;selTop5=allData[name]?.top5?[...allData[name].top5]:[];
  document.getElementById('input-hd').textContent=name+' · 강점 입력';
  renderInput();showScreen('s-input');
}
function renderInput(){
  const area=document.getElementById('input-area');
  let html=`<div class="top5-bar"><div class="top5-lbl">선택된 강점 (${selTop5.length}/5)</div><div class="top5-tags" id="t5tags"></div></div>`;
  ['ex','in','re','st'].forEach(d=>{
    const dom=DOM[d],list=S.filter(s=>s.d===d);
    html+=`<div class="domain-block"><div class="domain-hd" style="background:${dom.bg}"><div class="d-dot" style="background:${dom.color}"></div><div class="d-name" style="color:${dom.color}">${dom.name}</div><div class="d-cnt">${list.length}개</div></div><div class="chip-grid">`;
    list.forEach(s=>{
      const rank=selTop5.indexOf(s.ko);const sel=rank>=0;
      html+=`<div class="chip${sel?' sel':''}" id="c-${s.ko}" style="${sel?`background:${dom.color};border-color:${dom.color};`:''}" onclick="toggleChip('${s.ko}')">
        ${sel?`<div class="chip-rank">${rank+1}</div>`:''}
        <span class="chip-ko">${s.ko}</span><span class="chip-en">${s.en}</span></div>`;
    });
    html+=`</div></div>`;
  });
  html+=`<button class="sub-btn ${selTop5.length===5?'ready':''}" id="sub-btn" ${selTop5.length!==5?'disabled':''} onclick="submitStr()">
    ${selTop5.length===5?'✅ 저장하기':`상위 5개 선택 (${selTop5.length}/5)`}</button>`;
  area.innerHTML=html;
  renderT5Tags();
}
function renderT5Tags(){
  const el=document.getElementById('t5tags');if(!el)return;
  if(!selTop5.length){el.innerHTML='<span style="color:var(--text3);font-size:12px">아직 선택 없음</span>';return;}
  el.innerHTML=selTop5.map((ko,i)=>{const s=S.find(x=>x.ko===ko);const dom=DOM[s?.d||'ex'];return`<span class="ttag" style="background:${dom.bg};color:${dom.color}">${i+1}. ${ko}</span>`;}).join('');
}
function toggleChip(ko){
  const idx=selTop5.indexOf(ko);
  if(idx>=0)selTop5.splice(idx,1);
  else{if(selTop5.length>=5){alert('이미 5개 선택됨. 하나를 먼저 취소하세요.');return;}selTop5.push(ko);}
  renderInput();
}
async function submitStr(){
  if(selTop5.length!==5)return;
  const btn=document.getElementById('sub-btn');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>저장 중...';
  const ok=await saveData(curPerson,selTop5);
  if(ok){alert(`${curPerson}님의 강점이 저장되었습니다!`);goHome();}
  else{btn.disabled=false;btn.className='sub-btn ready';btn.innerHTML='✅ 저장하기';}
}

// ══════════════ PROFILE ══════════════
let rChart=null,bChart=null;

function openProfile(name){
  curPerson=name;
  const d=allData[name];if(!d){openInput(name);return;}
  document.getElementById('prof-hd').textContent=name;
  const team=TEAMS.find(t=>t.leader===name||t.members.includes(name));
  const role=team?.leader===name?'팀장':'팀원';
  const area=document.getElementById('prof-area');

  const cardsHtml=d.top5.map((ko,i)=>{
    const s=S.find(x=>x.ko===ko);const dom=DOM[s?.d||'ex'];
    return`<div class="str-card" style="background:${dom.bg}">
      <div class="str-card-top" onclick="toggleCard('card-${i}')">
        <div class="rank-circle" style="color:${dom.color}">${i+1}</div>
        <div class="sc-info">
          <div class="sc-ko">${ko}</div><div class="sc-en">${s?.en||''}</div>
          <span class="sc-domain" style="color:${dom.color}">${dom.name}</span>
        </div>
        <span style="color:${dom.color};font-size:18px">›</span>
      </div>
      <div class="str-expand" id="card-${i}">
        <div class="str-desc">${s?.desc||''}</div>
        <div class="str-pros-cons">
          <div class="pros-box"><div class="box-label">✅ 강점</div><div class="box-content">${s?.pros||''}</div></div>
          <div class="cons-box"><div class="box-label">⚠️ 주의</div><div class="box-content">${s?.cons||''}</div></div>
        </div>
      </div>
    </div>`;
  }).join('');

  area.innerHTML=`
    <div class="prof-hero">
      <div class="prof-name">${name}</div>
      <div class="prof-team">${team?.id||''} · ${role}</div>
      <div class="prof-updated">업데이트: ${d.updatedAt||''}</div>
      <button class="edit-btn" onclick="openInput('${name}')">✏️ 수정</button>
    </div>
    <div class="sec-label">상위 5대 강점 · 카드를 눌러 자세히 보기</div>
    ${cardsHtml}
    <div class="chart-box" style="margin-top:14px">
      <div class="chart-title">📡 영역별 분포</div>
      <div class="chart-wrap"><canvas id="rcv"></canvas></div>
    </div>
    <div class="chart-box">
      <div class="chart-title">📊 강점 순위</div>
      <div class="chart-wrap"><canvas id="bcv"></canvas></div>
    </div>
    <div class="ai-section">
      <div class="ai-header">
        <span style="font-size:20px">🤖</span>
        <span class="ai-title">AI 강점 분석</span>
        <button class="ai-run-btn" onclick="runAI('${name}')">분석 시작</button>
      </div>
      <div id="ai-result"><div class="ai-placeholder">버튼을 누르면 AI가 강점 조합을 분석해드립니다</div></div>
    </div>`;

  showScreen('s-profile');
  setTimeout(()=>drawCharts(d.top5),120);
}

function toggleCard(id){
  const el=document.getElementById(id);
  el.classList.toggle('open');
}

function drawCharts(top5){
  const cnt={ex:0,in:0,re:0,st:0};
  top5.forEach(ko=>{const s=S.find(x=>x.ko===ko);if(s)cnt[s.d]++;});
  const rc=document.getElementById('rcv')?.getContext('2d');
  if(!rc)return;
  if(rChart)rChart.destroy();
  rChart=new Chart(rc,{type:'radar',data:{labels:['실행력','영향력','관계형성','전략적사고'],datasets:[{data:[cnt.ex,cnt.in,cnt.re,cnt.st],backgroundColor:'rgba(139,92,246,0.2)',borderColor:'#8b5cf6',pointBackgroundColor:'#8b5cf6',pointRadius:5,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,scales:{r:{min:0,max:5,ticks:{stepSize:1,color:'#64748b',font:{size:10}},grid:{color:'#334155'},pointLabels:{color:'#94a3b8',font:{size:12}},angleLines:{color:'#334155'}}},plugins:{legend:{display:false}}}});
  const bc=document.getElementById('bcv')?.getContext('2d');
  if(!bc)return;
  if(bChart)bChart.destroy();
  const colors=top5.map(ko=>{const s=S.find(x=>x.ko===ko);return DOM[s?.d||'ex'].color;});
  bChart=new Chart(bc,{type:'bar',data:{labels:top5.map((ko,i)=>`${i+1}. ${ko}`),datasets:[{data:[5,4,3,2,1],backgroundColor:colors,borderRadius:8}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,scales:{x:{display:false},y:{grid:{display:false},ticks:{color:'#f1f5f9',font:{size:13,weight:'bold'}}}},plugins:{legend:{display:false}}}});
}

let geminiKey=localStorage.getItem('geminiKey')||'';
let pendingAI=null;

function saveAiKey(){
  const k=document.getElementById('ai-key-input').value.trim();

상위 5개 강점: ${top5Info}

(5개 강점이 함께 만드는 특별한 힘)

1.
2.
3.

### 주의할 점 3가지
1.
2.
3.

(이 사람이 팀에서 빛나는 역할)

### 협업 팁
(이 사람과 일할 때 효과적인 방법)`;

  try{

      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.7,maxOutputTokens:800}})
    });
    if(!r.ok){
      if(r.status===400||r.status===401||r.status===403){geminiKey='';localStorage.removeItem('geminiKey');throw new Error('API 키 오류');}
      throw new Error('API 오류 '+r.status);
    }
    const data=await r.json();
    let text=data.candidates?.[0]?.content?.parts?.[0]?.text||'분석 결과를 가져오지 못했습니다.';
    // 마크다운 렌더링
    text=text.replace(/### (.+)/g,'<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    el.innerHTML=`<div class="ai-result">${text}</div>`;
  }catch(e){
